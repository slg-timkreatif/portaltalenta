<script>
/* ================= KONFIG & STATE ================= */
const SUPABASE_URL = 'https://qamqqwfzhyiihqyzliwq.supabase.co';
const ANON_KEY = 'sb_publishable_O_qwmOBPSU8dylEPCrPRAA_GC25Ii5x';
const LOGIN_GURU_URL = SUPABASE_URL + '/functions/v1/login-guru';
const VERIFY_GURU_URL = SUPABASE_URL + '/functions/v1/verify-guru';
const TALENTA_API_URL = SUPABASE_URL + '/functions/v1/talenta-api';
let loginTab='guru', currentUser=null, settingsData={}, eventsData=[], allEventsData=[], cabangsData=[], dashboardData=[], sekolahList=[], aksesListData=[];
let selectedEventId=null, editingId=null, masterEventId=null, pantauanEventId=null, activeNav='beranda';
let verifFilter={status:'',sekolah:'',cabang:''}, selectedVerif=new Set();
let expScope={event:'',cabang:'',sekolah:'',mode:'penjurian',delim:';'};
let listPage=1; const PER_PAGE=10;
let autoRefreshTimer=null;
let historyState={t:'nav',nav:'beranda'};

/* ================= PALET WARNA ================= */
const COLOR_MAP={blue:{bg:'#dbeafe',text:'#1d4ed8'},emerald:{bg:'#d1fae5',text:'#047857'},orange:{bg:'#ffedd5',text:'#c2410c'},teal:{bg:'#ccfbf1',text:'#0f766e'},red:{bg:'#fee2e2',text:'#b91c1c'},indigo:{bg:'#e0e7ff',text:'#4338ca'},purple:{bg:'#f3e8ff',text:'#7e22ce'},rose:{bg:'#ffe4e6',text:'#be123c'},amber:{bg:'#fef3c7',text:'#b45309'},sky:{bg:'#e0f2fe',text:'#0369a1'},slate:{bg:'#f1f5f9',text:'#475569'},gray:{bg:'#f3f4f6',text:'#4b5563'},grey:{bg:'#f3f4f6',text:'#4b5563'}};
function getColor(w){return COLOR_MAP[w]||COLOR_MAP.blue;}
function chipStyle(w){var c=getColor(w);return 'background-color:'+c.bg+';color:'+c.text+';';}

/* ================= UTIL ================= */
function show(id){['screen-login','screen-loader','screen-app'].forEach(function(s){document.getElementById(s).classList.add('hidden');});document.getElementById(id).classList.remove('hidden');renderIcons();}
function renderIcons(){if(window.lucide)lucide.createIcons();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function roleLabelOf(r){return r==='KS'?'Kepala Sekolah':r==='GURU'?'Guru':r==='PANITIA'?'Panitia':'Admin';}
function toast(msg,type){type=type||'success';var el=document.getElementById('toast');var color=type==='success'?'bg-emerald-600':(type==='error'?'bg-red-600':'bg-blue-600');var icon=type==='success'?'check-circle':(type==='error'?'alert-circle':'info');el.innerHTML='<div class="'+color+' text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm"><i data-lucide="'+icon+'" class="w-4 h-4 flex-shrink-0"></i>'+msg+'</div>';el.classList.remove('hidden');renderIcons();setTimeout(function(){el.classList.add('hidden');},3500);}
function statusBadge(st){var map={'DRAFT':'bg-slate-100 text-slate-600','PENDING':'bg-amber-100 text-amber-700','REVISI':'bg-red-100 text-red-600','DISETUJUI':'bg-emerald-100 text-emerald-700','TERKUNCI':'bg-blue-100 text-blue-700'};return '<span class="px-2 py-0.5 rounded-full text-xs font-semibold '+(map[st]||'bg-slate-100')+'">'+st+'</span>';}
function getCabang(id){return cabangsData.find(function(c){return c.id===id;})||null;}
function getCabangName(id){var c=getCabang(id);return c?c.nama_cabang:'-';}
function getEventName(id){var e=[].concat(eventsData,allEventsData).find(function(x){return x.id_event===id;});return e?e.nama_event:id;}
function closeModal(){['modal-form','modal-verif','modal-generic'].forEach(function(id){var m=document.getElementById(id);if(m)m.remove();});document.body.classList.remove('modal-open');}
function openModalHook(){document.body.classList.add('modal-open');}
function isModalOpen(){return document.body.classList.contains('modal-open');}
function formatTTL(tempat,tanggal){if(!tempat&&!tanggal)return '-';var tgl=tanggal||'';if(tgl&&tgl.indexOf('-')>-1){var p=tgl.split('-');var b=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];tgl=parseInt(p[2])+' '+b[parseInt(p[1])]+' '+p[0];}return (tempat?tempat:'')+(tgl?', '+tgl:'');}
function fmtWaktu(x){if(!x)return '-';var d=new Date(x);if(isNaN(d.getTime()))return '-';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function emptyState(icon,title,desc){return '<div class="flex flex-col items-center justify-center py-14 text-center"><div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-4"><i data-lucide="'+icon+'" class="w-8 h-8 text-slate-400"></i></div><h3 class="font-semibold text-slate-600">'+title+'</h3><p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">'+desc+'</p></div>';}

/* ================= HISTORY / BACK ================= */
function pushState(st){historyState=st;try{history.pushState(st,'');}catch(e){}}
function replaceState(st){historyState=st;try{history.replaceState(st,'');}catch(e){}}
window.addEventListener('popstate',function(e){
  var overlay=document.getElementById('sidebar-overlay');
  if(overlay&&!overlay.classList.contains('hidden')){document.getElementById('sidebar').classList.add('-translate-x-full');overlay.classList.add('hidden');pushState(historyState);return;}
  if(isModalOpen()||document.getElementById('modal-confirm')){closeModal();closeConfirm();pushState(historyState);return;}
  var st=e.state||{t:'nav',nav:'beranda'};
  historyState=st;applyState(st);
});
function applyState(st){
  listPage=1;
  if(st.t==='event'){activeNav='beranda';selectedEventId=st.id;highlightNav('beranda');renderEventDetail();}
  else if(st.t==='cabang'){activeNav='master-event';masterEventId=st.id;highlightNav('master-event');renderMasterCabang();}
  else{activeNav=st.nav;if(st.nav==='beranda')selectedEventId=null;if(st.nav==='master-event')masterEventId=null;highlightNav(st.nav);renderNavView(st.nav);}
  renderIcons();
}
function highlightNav(id){document.querySelectorAll('.nav-btn').forEach(function(b){var a=b.dataset.nav===id;b.classList.toggle('bg-blue-50',a);b.classList.toggle('text-blue-700',a);b.classList.toggle('text-slate-600',!a);});}
function closeMobileSidebar(){if(window.innerWidth<1024){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden');}}
function goNav(id){listPage=1;activeNav=id;closeMobileSidebar();highlightNav(id);if(id==='beranda')selectedEventId=null;if(id==='master-event')masterEventId=null;renderNavView(id);pushState({t:'nav',nav:id});}
function renderNavView(id){if(id==='beranda')renderBeranda();else if(id==='verifikasi')renderVerifikasi();else if(id==='pantauan')renderPantauan();else if(id==='master-event')renderMasterEvent();else if(id==='master-akses')renderMasterAkses();else if(id==='pengaturan')renderPengaturan();else if(id==='panduan')renderPanduan();else if(id==='ekspor')renderEkspor();}
function selectEvent(id){selectedEventId=id;renderEventDetail();pushState({t:'event',id:id});}
function goCabang(id){masterEventId=id;renderMasterCabang();pushState({t:'cabang',id:id});}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden');}

/* ================= MODAL KONFIRMASI ================= */
function confirmDialog(msg,cb,opts){opts=opts||{};var title=opts.title||'Konfirmasi';var text=opts.confirmText||'Ya, Lanjutkan';var danger=opts.danger!==false;var btnColor=danger?'bg-red-600 hover:bg-red-700':'bg-blue-600 hover:bg-blue-700';var icon=danger?'alert-triangle':'help-circle';var iconColor=danger?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600';var modal=document.createElement('div');modal.id='modal-confirm';modal.className='fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4';modal.innerHTML='<div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center" role="dialog" aria-modal="true"><div class="w-12 h-12 rounded-full '+iconColor+' flex items-center justify-center mx-auto mb-4"><i data-lucide="'+icon+'" class="w-6 h-6"></i></div><h3 class="font-bold text-lg mb-1">'+title+'</h3><p class="text-sm text-slate-500 mb-6">'+msg+'</p><div class="flex gap-3"><button onclick="closeConfirm()" class="flex-1 py-2.5 rounded-xl border font-semibold text-slate-600 hover:bg-slate-50">Batal</button><button onclick="doConfirm()" class="flex-1 py-2.5 rounded-xl '+btnColor+' text-white font-semibold">'+text+'</button></div></div>';document.body.appendChild(modal);document.body.classList.add('modal-open');window.__confirmCb=cb;renderIcons();}
function closeConfirm(){var m=document.getElementById('modal-confirm');if(m)m.remove();if(!document.querySelector('.fixed.inset-0.z-50'))document.body.classList.remove('modal-open');window.__confirmCb=null;}
function doConfirm(){var cb=window.__confirmCb;closeConfirm();if(cb)cb();}

/* ================= PAGINATION ================= */
function paginate(items){var totalPages=Math.max(1,Math.ceil(items.length/PER_PAGE));if(listPage>totalPages)listPage=totalPages;if(listPage<1)listPage=1;var start=(listPage-1)*PER_PAGE;return{data:items.slice(start,start+PER_PAGE),totalPages:totalPages,total:items.length};}
function paginationControls(totalPages,fnName){if(totalPages<=1)return '';var b='';for(var i=1;i<=totalPages;i++){var cls=i===listPage?'bg-blue-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200';b+='<button onclick="'+fnName+'('+i+')" class="px-3 py-1.5 rounded-lg text-xs font-semibold '+cls+'">'+i+'</button>';}return '<div class="flex items-center justify-center gap-1 px-4 py-3 border-t flex-wrap">'+b+'</div>';}
function gotoVerifPage(p){listPage=p;renderVerifikasiRows();}
function gotoGuruPage(p){listPage=p;renderEventDetail();}

/* ================= API ================= */
async function talenta(action,payload){var res=await fetch(TALENTA_API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+(currentUser?currentUser.token:'')},body:JSON.stringify({action:action,payload:payload||{}})});var data=await res.json().catch(function(){return{status:'error',message:'Respons tidak valid'};});if(res.status===401){handleLogout(true);throw new Error('Sesi berakhir');}return data;}
async function verifyGuruToken(token){try{var res=await fetch(VERIFY_GURU_URL,{headers:{'apikey':ANON_KEY,'Authorization':'Bearer '+token}});var d=await res.json();if(d&&d.valid){if(d.profile){currentUser.nama_ks=d.profile.nama_ks||currentUser.nama_ks;currentUser.nip_ks=d.profile.nip_ks||currentUser.nip_ks;}return true;}return false;}catch(e){return false;}}
async function talentaLoginLocal(email,pin){var res=await fetch(TALENTA_API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY},body:JSON.stringify({action:'login',payload:{email:email,pin:pin}})});return res.json();}

/* ================= LOGIN ================= */
function switchLoginTab(tab){loginTab=tab;var g=tab==='guru';document.getElementById('tab-guru').className='py-2 rounded-lg text-sm font-semibold '+(g?'bg-white shadow text-blue-600':'text-slate-500');document.getElementById('tab-panitia').className='py-2 rounded-lg text-sm font-semibold '+(!g?'bg-white shadow text-blue-600':'text-slate-500');document.getElementById('tab-guru').setAttribute('aria-selected',g);document.getElementById('tab-panitia').setAttribute('aria-selected',!g);document.getElementById('label-email').textContent=g?'Email Guru':'Email Panitia/Admin';document.getElementById('inp-email').type=g?'email':'text';document.getElementById('login-error').classList.add('hidden');}
function togglePinVisibility(){var inp=document.getElementById('inp-pin');var icon=document.getElementById('icon-pin');if(inp.type==='password'){inp.type='text';icon.setAttribute('data-lucide','eye-off');}else{inp.type='password';icon.setAttribute('data-lucide','eye');}renderIcons();}
function showLoginError(msg){document.getElementById('login-error-msg').textContent=msg;document.getElementById('login-error').classList.remove('hidden');renderIcons();}
async function handleLogin(e){e.preventDefault();document.getElementById('login-error').classList.add('hidden');var email=document.getElementById('inp-email').value.trim();var pin=document.getElementById('inp-pin').value.trim();var btn=document.getElementById('btn-login');btn.disabled=true;btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memproses...';renderIcons();try{if(loginTab==='guru'){var res=await fetch(LOGIN_GURU_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},body:JSON.stringify({email:email,pin:pin})});var d=await res.json();if(!res.ok||!d.token)throw new Error(d.message||'Email atau PIN salah.');var jabatan=d.profile.jabatan||'';var role=jabatan.toLowerCase().indexOf('kepala')>-1?'KS':'GURU';currentUser={token:d.token,auth_source:'guru',email:d.profile.email,nama:d.profile.nama,sekolah:d.profile.sekolah,npsn:d.profile.npsn,jabatan:jabatan,role:role,nama_ks:d.profile.nama_ks||'-',nip_ks:d.profile.nip_ks||'-'};}else{var d2=await talentaLoginLocal(email,pin);if(d2.status!=='success')throw new Error(d2.message||'Login gagal.');currentUser={token:d2.token,auth_source:'panitia',email:d2.profile.email,nama:d2.profile.nama,role:d2.profile.role,akses_event:d2.profile.akses_event};}localStorage.setItem('talenta_session',JSON.stringify(currentUser));enterApp();}catch(err){showLoginError(err.message);}finally{btn.disabled=false;btn.innerHTML='<i data-lucide="log-in" class="w-4 h-4"></i> Masuk Sistem';renderIcons();}}
function handleLogout(forced){stopAutoRefresh();localStorage.removeItem('talenta_session');currentUser=null;selectedEventId=null;document.getElementById('form-login').reset();show('screen-login');if(forced)toast('Sesi berakhir, silakan login kembali.','error');}

/* ================= INIT & ENTER ================= */
async function init(){renderIcons();var saved=localStorage.getItem('talenta_session');if(!saved){show('screen-login');return;}show('screen-loader');try{var session=JSON.parse(saved);var valid=false;if(session.auth_source==='guru'){currentUser=session;valid=await verifyGuruToken(session.token);}else{currentUser=session;var r=await talenta('getSettings',{});valid=r.status==='success';if(valid)settingsData=r.data||{};}if(valid){enterApp();}else{localStorage.removeItem('talenta_session');show('screen-login');}}catch(e){localStorage.removeItem('talenta_session');show('screen-login');}}
async function enterApp(){show('screen-loader');try{var initials=(currentUser.nama||'?').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();document.getElementById('side-nama').textContent=currentUser.nama;document.getElementById('side-role').textContent=roleLabelOf(currentUser.role)+(currentUser.sekolah?' • '+currentUser.sekolah:'');document.getElementById('side-avatar').textContent=initials;document.getElementById('top-avatar-m').textContent=initials;buildSidebar();await Promise.all([loadInitData(),loadSettings()]);if(currentUser.auth_source==='guru'){try{var pr=await talenta('getMyProfile');if(pr.status==='success'&&pr.profile){currentUser.nama_ks=pr.profile.nama_ks||currentUser.nama_ks||'-';currentUser.nip_ks=pr.profile.nip_ks||currentUser.nip_ks||'-';localStorage.setItem('talenta_session',JSON.stringify(currentUser));}}catch(e){}}show('screen-app');activeNav='beranda';highlightNav('beranda');renderBeranda();replaceState({t:'nav',nav:'beranda'});startAutoRefresh();}catch(e){console.error('Gagal masuk aplikasi:',e);toast('Gagal memuat aplikasi. Silakan coba lagi.','error');show('screen-login');}}
async function loadSettings(){try{var r=await talenta('getSettings',{});if(r.status==='success')settingsData=r.data||{};}catch(e){}}

/* ================= SIDEBAR ================= */
function buildSidebar(){var menu=document.getElementById('sidebar-menu');var role=currentUser.role;var items=[{id:'beranda',label:'Beranda',icon:'layout-grid'}];if(role==='PANITIA'){items.push({id:'verifikasi',label:'Verifikasi',icon:'clipboard-check'});items.push({id:'pantauan',label:'Pantauan Sekolah',icon:'school'});items.push({id:'ekspor',label:'Pusat Ekspor',icon:'download'});}else if(role==='ADMIN'){items.push({id:'verifikasi',label:'Verifikasi',icon:'clipboard-check'});items.push({id:'pantauan',label:'Pantauan Sekolah',icon:'school'});items.push({id:'master-event',label:'Master Event & Cabang',icon:'database'});items.push({id:'master-akses',label:'Manajemen Akses',icon:'users'});items.push({id:'pengaturan',label:'Pengaturan',icon:'settings'});items.push({id:'ekspor',label:'Pusat Ekspor',icon:'download'});}items.push({id:'panduan',label:'Panduan & Tentang',icon:'book-open'});menu.innerHTML=items.map(function(it){return '<button data-nav="'+it.id+'" onclick="goNav(\''+it.id+'\')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition text-left"><i data-lucide="'+it.icon+'" class="w-4 h-4 flex-shrink-0"></i><span class="truncate">'+it.label+'</span></button>';}).join('');renderIcons();}

/* ================= AUTO REFRESH ================= */
function startAutoRefresh(){stopAutoRefresh();autoRefreshTimer=setInterval(function(){if(!isModalOpen())refreshCurrentView();},60000);}
function stopAutoRefresh(){if(autoRefreshTimer){clearInterval(autoRefreshTimer);autoRefreshTimer=null;}}
async function refreshCurrentView(){if(selectedVerif.size>0)return;try{await loadDashboard();if(activeNav==='verifikasi')renderVerifikasi();else if(activeNav==='pantauan')renderPantauan();}catch(e){}}
function manualRefresh(){toast('Memuat ulang data...','info');refreshCurrentView();}

/* ================= LOAD DATA ================= */
async function loadInitData(){try{var r=await talenta('getInitData',{});if(r.status==='success'){eventsData=r.events||[];cabangsData=r.cabangs||[];}}catch(e){console.error('Gagal memuat data awal:',e);}}
async function loadDashboard(){var r=await talenta('getDashboard',{});if(r.status==='success'){dashboardData=r.data||[];sekolahList=r.sekolahList||[];}}
async function loadAllEvents(){var r=await talenta('getAllEvents',{});if(r.status==='success'){allEventsData=r.events||[];if(r.cabangs)cabangsData=r.cabangs;}}
async function loadAksesList(){var r=await talenta('getPanitiaList',{});if(r.status==='success')aksesListData=r.data||[];}

/* ================= KUOTA ================= */
function kuotaCabang(c,rows){if(c.tipe_peserta==='PA/PI'){var pa=rows.filter(function(r){return r.cabang_id===c.id&&r.kategori_gender==='PA';}).length;var pi=rows.filter(function(r){return r.cabang_id===c.id&&r.kategori_gender==='PI';}).length;return{paPI:true,pa:pa,pi:pi,max:c.maks_peserta||1};}return{paPI:false,n:rows.filter(function(r){return r.cabang_id===c.id;}).length,max:c.maks_peserta||1};}
function kuotaLabel(c,rows){var k=kuotaCabang(c,rows);return k.paPI?('PA '+k.pa+'/'+k.max+' • PI '+k.pi+'/'+k.max):('Kuota '+k.n+'/'+k.max);}

/* ================= BERANDA ================= */
async function renderBeranda(){var main=document.getElementById('main-content');main.innerHTML='<div class="text-center py-10 text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Memuat...</div>';renderIcons();await loadDashboard();var role=currentUser.role;var isSchool=role==='GURU'||role==='KS';var events=eventsData;if(role==='PANITIA')events=eventsData.filter(function(e){return e.id_event===currentUser.akses_event;});if(selectedEventId&&!events.find(function(e){return e.id_event===selectedEventId;}))selectedEventId=null;
if(!selectedEventId){var cards='';if(events.length===0){cards='<div class="bg-white rounded-2xl border">'+emptyState('calendar-x','Tidak ada event aktif','Belum ada event lomba yang dibuka untuk Anda saat ini.')+'</div>';}else{cards='<div class="grid md:grid-cols-2 gap-4">'+events.map(function(ev){return '<button onclick="selectEvent(\''+ev.id_event+'\')" class="text-left bg-white border rounded-2xl p-5 hover:shadow-lg hover:border-blue-400 transition group focus:ring-2 focus:ring-blue-500"><div class="flex items-center justify-between mb-3"><div class="w-11 h-11 rounded-xl flex items-center justify-center" style="'+chipStyle(ev.warna_aksen)+'"><i data-lucide="'+(ev.ikon_fallback||'award')+'" class="w-5 h-5"></i></div><span class="text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold">AKTIF</span></div><h3 class="font-bold group-hover:text-blue-600 transition">'+esc(ev.nama_event)+'</h3><p class="text-xs text-slate-400 mt-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Batas: '+esc(ev.batas_daftar||'-')+'</p></button>';}).join('')+'</div>';}var refreshBtn=(role==='PANITIA'||role==='ADMIN')?'<button onclick="manualRefresh()" class="p-2 rounded-lg bg-white border hover:bg-slate-50 text-slate-500" aria-label="Muat ulang"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>':'';main.innerHTML=renderHeroBanner()+(isSchool?renderPintasan():'')+'<div class="mt-6"><div class="flex items-center justify-between mb-4"><div><h2 class="text-lg font-bold">Event Aktif</h2><p class="text-sm text-slate-500">Pilih event lomba untuk mengelola delegasi peserta.</p></div>'+refreshBtn+'</div>'+cards+'</div>';renderIcons();return;}
renderEventDetail();}
function renderHeroBanner(){var bg=settingsData['LANDING_BG']||'';if(!bg)return '';return '<div class="relative rounded-2xl overflow-hidden mb-5 h-48 md:h-60 bg-gradient-to-r from-blue-600 to-indigo-700"><img src="'+esc(bg)+'" alt="Latar beranda" class="absolute inset-0 w-full h-full object-cover opacity-60" onerror="this.style.display=\'none\'"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div><div class="relative h-full flex flex-col justify-end p-6 text-white"><h2 class="text-2xl md:text-3xl font-bold drop-shadow">Selamat Datang!</h2><p class="text-sm md:text-base opacity-90 drop-shadow">'+esc(currentUser.nama)+' • '+esc(currentUser.sekolah||roleLabelOf(currentUser.role))+'</p></div></div>';}
function renderPintasan(){var ps=[];for(var i=1;i<=3;i++){var l=settingsData['LABEL_'+i],k=settingsData['LINK_'+i],ic=settingsData['IKON_'+i]||'link';if(l&&k)ps.push({label:l,link:k,icon:ic});}if(!ps.length)return '';return '<div class="mb-5"><h3 class="text-sm font-semibold text-slate-600 mb-3 flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i>Pintasan Informasi</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-3">'+ps.map(function(p){return '<a href="'+esc(p.link)+'" target="_blank" rel="noopener" class="bg-white border rounded-xl p-4 hover:shadow-md hover:border-blue-400 transition flex items-center gap-3 focus:ring-2 focus:ring-blue-500"><div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0"><i data-lucide="'+esc(p.icon)+'" class="w-5 h-5"></i></div><div class="min-w-0"><p class="font-semibold text-sm truncate">'+esc(p.label)+'</p><p class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="external-link" class="w-3 h-3"></i>Buka</p></div></a>';}).join('')+'</div></div>';}

/* ================= DETAIL EVENT ================= */
function renderEventDetail(){var main=document.getElementById('main-content');var ev=eventsData.find(function(e){return e.id_event===selectedEventId;});if(!ev){selectedEventId=null;return renderBeranda();}var role=currentUser.role;var isSchool=role==='GURU'||role==='KS';var rows=dashboardData.filter(function(d){return d.id_event===selectedEventId;});var cabangs=cabangsData.filter(function(c){return c.id_event===selectedEventId;});var lockBtn=(isSchool)?'<button onclick="lockEvent()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold flex items-center gap-2 hover:bg-blue-700"><i data-lucide="lock" class="w-4 h-4"></i>Kunci & Kirim Semua</button>':'';main.innerHTML='<button onclick="history.back()" class="text-sm text-slate-500 hover:text-blue-600 flex items-center gap-1 mb-4"><i data-lucide="arrow-left" class="w-4 h-4"></i>Kembali</button><div class="bg-white border rounded-2xl p-5 mb-5"><div class="flex items-center justify-between flex-wrap gap-3"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl flex items-center justify-center" style="'+chipStyle(ev.warna_aksen)+'"><i data-lucide="'+(ev.ikon_fallback||'award')+'" class="w-5 h-5"></i></div><div><h2 class="font-bold">'+esc(ev.nama_event)+'</h2><p class="text-xs text-slate-400">Batas daftar: '+esc(ev.batas_daftar||'-')+'</p></div></div>'+lockBtn+'</div></div>'+(isSchool?renderEventDetailGuru(rows,cabangs):renderEventDetailPanitia(rows));renderIcons();}
function renderEventDetailGuru(rows,cabangs){var draftCount=rows.filter(function(r){return r.status_daftar==='DRAFT'||r.status_daftar==='REVISI';}).length;var pg=paginate(rows);var chips=cabangs.map(function(c){var k=kuotaCabang(c,rows);var penuh=k.paPI?(k.pa>=k.max&&k.pi>=k.max):(k.n>=k.max);return '<span class="px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5" style="'+chipStyle(c.warna_cabang||'gray')+'"><i data-lucide="'+(c.ikon_cabang||'check-circle')+'" class="w-3.5 h-3.5"></i>'+esc(c.nama_cabang)+' <span class="text-[10px] font-bold opacity-75">('+kuotaLabel(c,rows)+')</span>'+(penuh?'<span class="text-[9px] font-bold bg-red-600 text-white px-1.5 py-0.5 rounded-full">PENUH</span>':'')+'</span>';}).join('')||'<span class="text-slate-400 text-sm">Belum ada cabang.</span>';var warning='';if(draftCount>0&&(currentUser.role==='KS'||currentUser.role==='GURU')){warning='<div class="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-sm flex items-start gap-2" role="alert"><i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i><span>Ada <b>'+draftCount+'</b> peserta masih berstatus DRAFT/REVISI. Jangan lupa klik <b>Kunci & Kirim Semua</b> agar diverifikasi panitia.</span></div>';}var trs=pg.data.map(function(r){var canEdit=r.status_daftar==='DRAFT'||r.status_daftar==='REVISI';var aksi='<button onclick="unduhBukti(\''+r.id_daftar+'\')" class="p-1.5 rounded-lg hover:bg-emerald-50 text-emerald-600" title="Unduh Bukti" aria-label="Unduh bukti"><i data-lucide="file-down" class="w-4 h-4"></i></button>';if(canEdit){aksi+='<button onclick="openForm(\''+r.id_daftar+'\')" class="p-1.5 rounded-lg hover:bg-blue-50 text-blue-600" title="Edit" aria-label="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="hapusDaftar(\''+r.id_daftar+'\')" class="p-1.5 rounded-lg hover:bg-red-50 text-red-500" title="Hapus" aria-label="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>';}else{aksi+='<span class="te function renderEventDetailPanitia(rows){return '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">'+statCard('Total',rows.length,'users','blue')+statCard('Disetujui',rows.filter(function(r){return r.status_daftar==='DISETUJUI';}).length,'check-circle','emerald')+statCard('Antrean',rows.filter(function(r){return r.status_daftar==='PENDING';}).length,'clock','amber')+statCard('Sekolah',new Set(rows.map(function(r){return r.asal_sekolah;})).size,'school','indigo')+'</div><button onclick="goNav(\'verifikasi\')" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold flex items-center gap-2 hover:bg-blue-700"><i data-lucide="clipboard-check" class="w-4 h-4"></i>Buka Antrean Verifikasi</button>';}

/* ================= FORM PESERTA ================= */
function openForm(idDaftar){editingId=idDaftar;openModalHook();var cabangs=cabangsData.filter(function(c){return c.id_event===selectedEventId;});var semua=dashboardData.filter(function(d){return d.id_event===selectedEventId;});var rows=idDaftar?semua.filter(function(r){return r.id_daftar!==idDaftar;}):semua;window.__formRows=rows;var existing=idDaftar?dashboardData.find(function(d){return d.id_daftar===idDaftar;}):null;var opts=cabangs.map(function(c){var sel=existing&&existing.cabang_id===c.id?'selected':'';return '<option value="'+c.id+'" '+sel+'>'+esc(c.nama_cabang)+' ('+kuotaLabel(c,rows)+')</option>';}).join('');var modal=document.createElement('div');modal.id='modal-form';modal.className='fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4';modal.innerHTML='<div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true"><div class="px-6 py-4 border-b flex items-center justify-between"><h3 class="font-bold">'+(idDaftar?'Edit Peserta':'Tambah Peserta')+'</h3><button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100" aria-label="Tutup"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-6 space-y-4"><div><label for="f-cabang" class="block text-sm font-medium mb-1">Cabang Lomba *</label><select id="f-cabang" onchange="onCabangChange()" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500">'+opts+'</select><p id="kuota-hint" class="text-xs text-slate-400 mt-1"></p></div><div id="wrap-kategori" class="hidden"><label for="f-kategori" class="block text-sm font-medium mb-1">Kategori Lomba *</label><select id="f-kategori" onchange="syncJk()" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"></select></div><div><label for="f-jk" class="block text-sm font-medium mb-1">Jenis Kelamin</label><select id="f-jk" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500 disable /* ================= PUSAT EKSPOR (3 MODE) + TERBITKAN ================= */
function expScopeRows(){
  var base=dashboardData;
  if(currentUser.role==='PANITIA') base=base.filter(function(d){return d.id_event===currentUser.akses_event;});
  else if(expScope.event) base=base.filter(function(d){return d.id_event===expScope.event;});
  return base.filter(function(r){
    if(expScope.cabang&&r.cabang_id!==expScope.cabang)return false;
    if(expScope.sekolah&&r.asal_sekolah!==expScope.sekolah)return false;
    return true;
  });
}
function expPrefix(){return expScope.mode==='penjurian'?'penjurian':(expScope.mode==='lengkap'?'penjurian-lengkap':'rekap');}
function expFilename(prefix){
  var ev=expScope.event||(currentUser.role==='PANITIA'?currentUser.akses_event:'SEMUA-EVENT');
  var cb=expScope.cabang?(getCabang(expScope.cabang)?getCabang(expScope.cabang).nama_cabang.replace(/[^a-z0-9]+/gi,'-'):'cabang'):'SEMUA-CABANG';
  var st=(expScope.mode==='rekap')?'SEMUA':'FINAL';
  var d=new Date();var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return prefix+'_'+ev+'_'+cb+'_'+st+'_'+ds+'.csv';
}
function csvCell(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}
function buildCSV(rows,mode){
  var d=expScope.delim;var header,lines;
  if(mode==='penjurian'){
    header=['id_daftar','id_event','nama_event','id_cabang','nama_cabang','kategori','nama_peserta','nisn','jk','asal_sekolah','kelas','link_berkas','status'];
    lines=[header.join(d)];
    rows.forEach(function(r){lines.push([r.id_daftar,r.id_event,getEventName(r.id_event),r.cabang_id,getCabangName(r.cabang_id),r.kategori_gender||'Umum',r.nama_peserta,r.nisn||'',r.jenis_kelamin||'',r.asal_sekolah,r.kelas||'',r.link_syarat||'',r.status_daftar].map(csvCell).join(d));});
  } else if(mode==='lengkap'){
    header=['id_daftar','id_event','nama_event','id_cabang','nama_cabang','kategori','nama_peserta','nisn','jk','tempat_lahir','tanggal_lahir','asal_sekolah','kelas','guru_pendamping','waktu_kirim','link_berkas','status'];
    lines=[header.join(d)];
    rows.forEach(function(r){lines.push([r.id_daftar,r.id_event,getEventName(r.id_event),r.cabang_id,getCabangName(r.cabang_id),r.kategori_gender||'Umum',r.nama_peserta,r.nisn||'',r.jenis_kelamin||'',r.tempat_lahir||'',r.tanggal_lahir||'',r.asal_sekolah,r.kelas||'',r.guru_pendamping_nama||'',r.created_at||'',r.link_syarat||'',r.status_daftar].map(csvCell).join(d));});
  } else {
    header=['no','id_daftar','waktu','event','cabang','kategori','nama_peserta','nisn','jk','kelas','tempat_lahir','tanggal_lahir','asal_sekolah','guru_pendamping','status','catatan','juara','link_sertifikat','link_berkas','dikunci_oleh','waktu_kunci'];
    lines=[header.join(d)];
    rows.forEach(function(r,i){lines.push([i+1,r.id_daftar,r.created_at,getEventName(r.id_event),getCabangName(r.cabang_id),r.kategori_gender||'',r.nama_peserta,r.nisn||'',r.jenis_kelamin||'',r.kelas||'',r.tempat_lahir||'',r.tanggal_lahir||'',r.asal_sekolah,r.guru_pendamping_nama||'',r.status_daftar,r.catatan_panitia||'',r.status_juara||'',r.link_sertifikat||'',r.link_syarat||'',r.locked_by||'',r.locked_at||''].map(csvCell).join(d));});
  }
  return lines.join('\n');
}
function downloadExport(){
  var rows=window.__exportRows||[];
  if(!rows.length){toast('Tidak ada data untuk diekspor.','error');return;}
  var mode=expScope.mode;
  var doIt=function(){
    var csv="\uFEFF"+buildCSV(rows,mode);
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=expFilename(expPrefix());a.click();
    toast('File CSV berhasil diunduh.');
  };
  var w=window.__exportWarnings||0;
  if(w>0){confirmDialog('Ditemukan <b>'+w+'</b> peringatan kualitas data pada scope ini. Tetap ekspor?',doIt,{title:'Peringatan Kualitas',confirmText:'Tetap Ekspor',danger:false});}
  else doIt();
}

    if(r.status==='success'){toast(r.message);await loadDashboard();renderEkspor();}
    else toast(r.message||'Gagal membuka kunci.','error');
  },{title:'Buka Kunci',confirmText:'Buka',danger:true});
}

function guideCard(icon,title,steps){return '<div class="bg-white border rounded-2xl p-5"><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div><h3 class="font-bold">'+title+'</h3></div><ol class="space-y-2.5">'+steps.map(function(s,i){return '<li class="flex gap-3 text-sm text-slate-600"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center">'+(i+1)+'</span><span>'+s+'</span></li>';}).join('')+'</ol></div>';}
function creditsCard(){return '<div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-6 text-white"><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center"><i data-lucide="award" class="w-5 h-5"></i></div><div><h3 class="font-bold">Portal Talenta <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full ml-1">v2.0</span></h3><p class="text-xs text-blue-100">Sistem Manajemen Delegasi Lomba & Event</p></div></div><div class="space-y-2 text-sm text-blue-50"><p class="flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4 flex-shrink-0"></i> Milik: Korwilcambidik Selogiri</p><p class="flex items-center gap-2"><i data-lucide="code-2" class="w-4 h-4 flex-shrink-0"></i> Dikembangkan oleh: <b>Ekwan Nugroho, S.Pd.I</b></p><p class="flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 flex-shrink-0"></i> Teknologi: Supabase • Tailwind CSS • Lucide Icons</p><p class="flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 flex-shrink-0"></i> Login guru terpusat (SSO) database guru kecamatan</p></div><p class="mt-4 pt-4 border-t border-white/20 text-[11px] text-blue-200">© 2026 Korwilcambidik Selogiri. Seluruh hak cipta.</p></div>';}
function buildGuideSections(role){var h='';h+=guideCard('log-in','Masuk & Navigasi (Semua Pengguna)',['Guru/KS masuk lewat tab <b>Guru / Sekolah</b> menggunakan email + PIN akun pusat kecamatan.','Panitia/Admin masuk lewat tab <b>Panitia / Admin</b> menggunakan email + PIN yang dibuat Administrator.','Gunakan menu pada sidebar kiri untuk berpindah halaman (tombol ☰ di pojok kiri atas pada HP).','Tombol <b>kembali (back)</b> di HP akan membawa Anda ke menu sebelumnya, bukan menutup aplikasi.','Data diperbarui otomatis setiap 60 detik; tombol ⟳ tersedia untuk muat ulang manual.','Akhiri sesi dengan ikon keluar di bagian bawah sidebar demi keamanan akun.']);if(!role||role==='GURU'||role==='KS'){h+=guideCard('users','Panduan Guru / Sekolah',['Buka <b>Beranda</b>, pilih event lomba yang berstatus AKTIF.','Perhatikan indikator kuota pada tiap cabang (mis. 1/1). Cabang bertanda PENUH tidak bisa ditambah.','Klik <b>Tambah Peserta</b>, lengkapi data siswa, lalu <b>Simpan Draft</b>.','Kolom link berkas hanya muncul pada cabang yang mewajibkan lampiran.','Peserta dapat diedit/dihapus selama status masih <b>DRAFT</b> atau <b>REVISI</b>.','Guru juga dapat menekan <b>Kunci & Kirim Semua</b> setelah data final sekolah (tidak harus menunggu KS). Nama pengunci akan tercatat.','Klik ikon <b>Unduh Bukti</b> untuk mencetak bukti pendaftaran (simpan sebagai PDF).','Jika peserta berstatus <b>REVISI</b>, baca catatan panitia, perbaiki, lalu simpan kembali.']);}if(!role||role==='KS'){h+=guideCard('lock','Panduan Kepala Sekolah',['Periksa seluruh draft peserta yang dimasukkan guru di sekolah Anda.','Jika sudah final, klik <b>Kunci & Kirim Semua</b> (dapat dilakukan KS atau guru yang ditunjuk sekolah).','Setelah dikunci, status menjadi <b>PENDING</b> dan data tidak dapat diubah lagi.','Perhatikan peringatan kuning bila masih ada draft yang belum dikunci.']);}if(!role||role==='PANITIA'||role==='ADMIN'){h+=guideCard('clipboard-check','Panduan Panitia',['Buka menu <b>Verifikasi</b> untuk melihat antrean peserta berstatus PENDING.','Persempit tampilan dengan filter Status / Instansi / Cabang Lomba.','Periksa berkas lewat tautan "Lihat Berkas" sebelum mengambil keputusan.','Klik <b>Setujui</b> atau <b>Revisi</b> (wajib menulis catatan revisi).','Gunakan centang + <b>Setujui Terpilih</b> untuk verifikasi massal.','Setelah disetujui, input pemenang lewat tombol <b>Juara</b> beserta link sertifikat.']);}if(!role||role==='ADMIN'){h+=guideCard('settings','Panduan Administrator',['<b>Master Event & Cabang</b>: buat, ubah, atau hapus event dan cabang lomba baru.','<b>Manajemen Akses</b>: tambah akun panitia/admin, reset PIN, atur masa berlaku, nonaktifkan akun.','<b>Pengaturan</b>: ganti gambar latar beranda dan pintasan informasi untuk guru.','<b>Pantauan Sekolah</b>: matriks partisipasi + peringatan sekolah yang belum mengunci data.','<b>Pusat Ekspor</b>: 3 mode ekspor (Penjurian / Penjurian Lengkap / Rekap Total) dengan gerbang kualitas, dan Terbitkan Data Penjurian.']);}h+=creditsCard();return h;}
function renderPanduan(){var main=document.getElementById('main-content');main.innerHTML='<h2 class="text-lg font-bold mb-1">Panduan Penggunaan</h2><p class="text-sm text-slate-500 mb-5">Langkah-langkah penggunaan aplikasi sesuai peran Anda ('+esc(roleLabelOf(currentUser.role))+'), serta informasi tentang aplikasi.</p><div class="grid md:grid-cols-2 gap-4 items-start">'+buildGuideSections(currentUser.role)+'</div>';renderIcons();}
function openPublicGuide(){openModalHook();var modal=document.createElement('div');modal.id='modal-generic';modal.className='fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4';modal.innerHTML='<div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true"><div class="px-6 py-4 border-b flex items-center justify-between sticky top-0 bg-white z-10"><h3 class="font-bold">Panduan Penggunaan Portal Talenta</h3><button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100" aria-label="Tutup"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-6 grid md:grid-cols-2 gap-4 items-start">'+buildGuideSections(null)+'</div></div>';document.body.appendChild(modal);renderIcons();}

document.addEventListener('DOMContentLoaded',init);
</script>
