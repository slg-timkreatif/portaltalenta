/* ============================================================
   PALET WARNA
============================================================ */
const COLOR_MAP = {
  blue:{bg:'#dbeafe',text:'#1d4ed8'}, emerald:{bg:'#d1fae5',text:'#047857'},
  orange:{bg:'#ffedd5',text:'#c2410c'}, teal:{bg:'#ccfbf1',text:'#0f766e'},
  red:{bg:'#fee2e2',text:'#b91c1c'}, indigo:{bg:'#e0e7ff',text:'#4338ca'},
  purple:{bg:'#f3e8ff',text:'#7e22ce'}, rose:{bg:'#ffe4e6',text:'#be123c'},
  amber:{bg:'#fef3c7',text:'#b45309'}, sky:{bg:'#e0f2fe',text:'#0369a1'},
  slate:{bg:'#f1f5f9',text:'#475569'}, gray:{bg:'#f3f4f6',text:'#4b5563'},
  grey:{bg:'#f3f4f6',text:'#4b5563'}
};
function getColor(w){ return COLOR_MAP[w] || COLOR_MAP.blue; }
function chipStyle(w){ const c=getColor(w); return 'background-color:'+c.bg+';color:'+c.text+';'; }

/* ============================================================
   UTIL
============================================================ */
function show(id){
  ['screen-login','screen-loader','screen-app'].forEach(function(s){document.getElementById(s).classList.add('hidden');});
  document.getElementById(id).classList.remove('hidden');
  renderIcons();
}
function renderIcons(){ if(window.lucide) lucide.createIcons(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function roleLabelOf(r){ return r==='KS'?'Kepala Sekolah':r==='GURU'?'Guru':r==='PANITIA'?'Panitia':'Admin'; }
function toast(msg,type){
  type=type||'success';
  const el=document.getElementById('toast');
  const color=type==='success'?'bg-emerald-600':(type==='error'?'bg-red-600':'bg-blue-600');
  const icon=type==='success'?'check-circle':(type==='error'?'alert-circle':'info');
  el.innerHTML='<div class="'+color+' text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm"><i data-lucide="'+icon+'" class="w-4 h-4 flex-shrink-0"></i>'+msg+'</div>';
  el.classList.remove('hidden'); renderIcons();
  setTimeout(function(){el.classList.add('hidden');},3500);
}
function statusBadge(st){
  const map={'DRAFT':'bg-slate-100 text-slate-600','PENDING':'bg-amber-100 text-amber-700','REVISI':'bg-red-100 text-red-600','DISETUJUI':'bg-emerald-100 text-emerald-700','TERKUNCI':'bg-blue-100 text-blue-700'};
  return '<span class="px-2 py-0.5 rounded-full text-xs font-semibold '+(map[st]||'bg-slate-100')+'">'+st+'</span>';
}
function getCabang(id){ return cabangsData.find(function(c){return c.id===id;})||null; }
function getCabangName(id){ const c=getCabang(id); return c?c.nama_cabang:'-'; }
function closeModal(){
  ['modal-form','modal-verif','modal-generic'].forEach(function(id){const m=document.getElementById(id); if(m)m.remove();});
  document.body.classList.remove('modal-open');
}
function openModalHook(){ document.body.classList.add('modal-open'); }
function isModalOpen(){ return document.body.classList.contains('modal-open'); }
function formatTTL(tempat,tanggal){
  if(!tempat && !tanggal) return '-';
  let tgl = tanggal || '';
  if(tgl && tgl.indexOf('-')>-1){
    const parts=tgl.split('-');
    const bulan=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    tgl=parseInt(parts[2])+' '+bulan[parseInt(parts[1])]+' '+parts[0];
  }
  return (tempat?tempat:'')+(tgl?', '+tgl:'');
}
function emptyState(icon,title,desc){
  return '<div class="flex flex-col items-center justify-center py-14 text-center">'
    +'<div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-4"><i data-lucide="'+icon+'" class="w-8 h-8 text-slate-400"></i></div>'
    +'<h3 class="font-semibold text-slate-600">'+title+'</h3>'
    +'<p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">'+desc+'</p></div>';
}

/* ============================================================
   MODAL KONFIRMASI
============================================================ */
function confirmDialog(msg, cb, opts){
  opts=opts||{};
  const title=opts.title||'Konfirmasi';
  const text=opts.confirmText||'Ya, Lanjutkan';
  const danger=opts.danger!==false;
  const btnColor=danger?'bg-red-600 hover:bg-red-700':'bg-blue-600 hover:bg-blue-700';
  const icon=danger?'alert-triangle':'help-circle';
  const iconColor=danger?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600';
  const modal=document.createElement('div');
  modal.id='modal-confirm';
  modal.className='fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4';
  modal.innerHTML='<div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center" role="dialog" aria-modal="true">'
    +'<div class="w-12 h-12 rounded-full '+iconColor+' flex items-center justify-center mx-auto mb-4"><i data-lucide="'+icon+'" class="w-6 h-6"></i></div>'
    +'<h3 class="font-bold text-lg mb-1">'+title+'</h3>'
    +'<p class="text-sm text-slate-500 mb-6">'+msg+'</p>'
    +'<div class="flex gap-3">'
    +'<button onclick="closeConfirm()" class="flex-1 py-2.5 rounded-xl border font-semibold text-slate-600 hover:bg-slate-50">Batal</button>'
    +'<button onclick="doConfirm()" class="flex-1 py-2.5 rounded-xl '+btnColor+' text-white font-semibold">'+text+'</button>'
    +'</div></div>';
  document.body.appendChild(modal);
  document.body.classList.add('modal-open');
  window.__confirmCb=cb;
  renderIcons();
}
function closeConfirm(){
  const m=document.getElementById('modal-confirm'); if(m)m.remove();
  if(!document.querySelector('.fixed.inset-0.z-50')) document.body.classList.remove('modal-open');
  window.__confirmCb=null;
}
function doConfirm(){ const cb=window.__confirmCb; closeConfirm(); if(cb)cb(); }

/* ============================================================
   PAGINATION
============================================================ */
function paginate(items){
  const totalPages=Math.max(1,Math.ceil(items.length/PER_PAGE));
  if(listPage>totalPages) listPage=totalPages;
  if(listPage<1) listPage=1;
  const start=(listPage-1)*PER_PAGE;
  return { data:items.slice(start,start+PER_PAGE), totalPages:totalPages, total:items.length };
}
function paginationControls(totalPages, fnName){
  if(totalPages<=1) return '';
  let btns='';
  for(let i=1;i<=totalPages;i++){
    const cls=i===listPage?'bg-blue-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200';
    btns+='<button onclick="'+fnName+'('+i+')" class="px-3 py-1.5 rounded-lg text-xs font-semibold '+cls+'">'+i+'</button>';
  }
  return '<div class="flex items-center justify-center gap-1 px-4 py-3 border-t flex-wrap">'+btns+'</div>';
}
function gotoVerifPage(p){ listPage=p; renderVerifikasiRows(); }
function gotoGuruPage(p){ listPage=p; renderEventDetail(); }

/* ============================================================
   API
============================================================ */
async function talenta(action,payload){
  const res=await fetch(TALENTA_API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+(currentUser?currentUser.token:'')},
    body:JSON.stringify({action:action,payload:payload||{}})
  });
  const data=await res.json().catch(function(){return {status:'error',message:'Respons tidak valid'};});
  if(res.status===401){ handleLogout(true); throw new Error('Sesi berakhir'); }
  return data;
}
async function verifyGuruToken(token){
  try{
    const res=await fetch(VERIFY_GURU_URL,{headers:{'apikey':ANON_KEY,'Authorization':'Bearer '+token}});
    const d=await res.json();
    if(d && d.valid){
      if(d.profile){
        currentUser.nama_ks = d.profile.nama_ks || currentUser.nama_ks;
        currentUser.nip_ks = d.profile.nip_ks || currentUser.nip_ks;
      }
      return true;
    }
    return false;
  }catch(e){ return false; }
}
async function talentaLoginLocal(email,pin){
  const res=await fetch(TALENTA_API_URL,{
    method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY},
    body:JSON.stringify({action:'login',payload:{email:email,pin:pin}})
  });
  return res.json();
}

/* ============================================================
   LOGIN
============================================================ */
function switchLoginTab(tab){
  loginTab=tab;
  const isGuru=tab==='guru';
  document.getElementById('tab-guru').className='py-2 rounded-lg text-sm font-semibold '+(isGuru?'bg-white shadow text-blue-600':'text-slate-500');
  document.getElementById('tab-panitia').className='py-2 rounded-lg text-sm font-semibold '+(!isGuru?'bg-white shadow text-blue-600':'text-slate-500');
  document.getElementById('tab-guru').setAttribute('aria-selected',isGuru);
  document.getElementById('tab-panitia').setAttribute('aria-selected',!isGuru);
  document.getElementById('label-email').textContent=isGuru?'Email Guru':'Email Panitia/Admin';
  document.getElementById('inp-email').type=isGuru?'email':'text';
  document.getElementById('login-error').classList.add('hidden');
}
function togglePinVisibility(){
  const inp=document.getElementById('inp-pin');
  const icon=document.getElementById('icon-pin');
  if(inp.type==='password'){ inp.type='text'; icon.setAttribute('data-lucide','eye-off'); }
  else { inp.type='password'; icon.setAttribute('data-lucide','eye'); }
  renderIcons();
}
function showLoginError(msg){
  document.getElementById('login-error-msg').textContent=msg;
  document.getElementById('login-error').classList.remove('hidden'); renderIcons();
}

async function handleLogin(e){
  e.preventDefault();
  document.getElementById('login-error').classList.add('hidden');
  const email=document.getElementById('inp-email').value.trim();
  const pin=document.getElementById('inp-pin').value.trim();
  const btn=document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memproses...'; renderIcons();
  try{
    if(loginTab==='guru'){
      const res=await fetch(LOGIN_GURU_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},body:JSON.stringify({email:email,pin:pin})});
      const d=await res.json();
      if(!res.ok||!d.token) throw new Error(d.message||'Email atau PIN salah.');
      const jabatan=d.profile.jabatan||'';
      const role=jabatan.toLowerCase().indexOf('kepala')>-1?'KS':'GURU';
      currentUser={token:d.token,auth_source:'guru',email:d.profile.email,nama:d.profile.nama,sekolah:d.profile.sekolah,npsn:d.profile.npsn,jabatan:jabatan,role:role,nama_ks:d.profile.nama_ks||'-',nip_ks:d.profile.nip_ks||'-'};
    } else {
      const d=await talentaLoginLocal(email,pin);
      if(d.status!=='success') throw new Error(d.message||'Login gagal.');
      currentUser={token:d.token,auth_source:'panitia',email:d.profile.email,nama:d.profile.nama,role:d.profile.role,akses_event:d.profile.akses_event};
    }
    localStorage.setItem('talenta_session',JSON.stringify(currentUser));
    enterApp();
  }catch(err){ showLoginError(err.message); }
  finally{ btn.disabled=false; btn.innerHTML='<i data-lucide="log-in" class="w-4 h-4"></i> Masuk Sistem'; renderIcons(); }
}

function handleLogout(forced){
  stopAutoRefresh();
  localStorage.removeItem('talenta_session'); currentUser=null; selectedEventId=null;
  document.getElementById('form-login').reset();
  show('screen-login');
  if(forced) toast('Sesi berakhir, silakan login kembali.','error');
}

/* ============================================================
   INIT & ENTER APP
============================================================ */
async function init(){
  renderIcons();
  const saved=localStorage.getItem('talenta_session');
  if(!saved){ show('screen-login'); return; }
  show('screen-loader');
  try{
    const session=JSON.parse(saved);
    let valid=false;
    if(session.auth_source==='guru'){ currentUser=session; valid=await verifyGuruToken(session.token); }
    else { currentUser=session; const r=await talenta('getSettings',{}); valid=r.status==='success'; if(valid) settingsData=r.data||{}; }
    if(valid){ enterApp(); } else { localStorage.removeItem('talenta_session'); show('screen-login'); }
  }catch(e){ localStorage.removeItem('talenta_session'); show('screen-login'); }
}

async function enterApp(){
  show('screen-loader');
  try{
    const initials=(currentUser.nama||'?').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
    document.getElementById('side-nama').textContent=currentUser.nama;
    document.getElementById('side-role').textContent=roleLabelOf(currentUser.role)+(currentUser.sekolah?' • '+currentUser.sekolah:'');
    document.getElementById('side-avatar').textContent=initials;
    document.getElementById('top-avatar-m').textContent=initials;
    buildSidebar();
    await Promise.all([loadInitData(), loadSettings()]);
    show('screen-app');
    setNav('beranda');
    startAutoRefresh();
  }catch(e){
    console.error('Gagal masuk aplikasi:', e);
    toast('Gagal memuat aplikasi. Silakan coba lagi.','error');
    show('screen-login');
  }
}

async function loadSettings(){
  try{ const r=await talenta('getSettings',{}); if(r.status==='success') settingsData=r.data||{}; }catch(e){}
}

/* ============================================================
   SIDEBAR
============================================================ */
function buildSidebar(){
  const menu=document.getElementById('sidebar-menu');
  const role=currentUser.role;
  let items=[{id:'beranda',label:'Beranda',icon:'layout-grid'}];
  if(role==='PANITIA'){
    items.push({id:'verifikasi',label:'Verifikasi',icon:'clipboard-check'});
    items.push({id:'pantauan',label:'Pantauan Sekolah',icon:'school'});
    items.push({id:'ekspor',label:'Ekspor CSV',icon:'download'});
  } else if(role==='ADMIN'){
    items.push({id:'verifikasi',label:'Verifikasi',icon:'clipboard-check'});
    items.push({id:'pantauan',label:'Pantauan Sekolah',icon:'school'});
    items.push({id:'master-event',label:'Master Event & Cabang',icon:'database'});
    items.push({id:'master-akses',label:'Manajemen Akses',icon:'users'});
    items.push({id:'pengaturan',label:'Pengaturan',icon:'settings'});
    items.push({id:'ekspor',label:'Ekspor CSV',icon:'download'});
  }
  items.push({id:'panduan',label:'Panduan & Tentang',icon:'book-open'});
  menu.innerHTML=items.map(function(it){
    return '<button data-nav="'+it.id+'" onclick="setNav(\''+it.id+'\')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition text-left">'
      +'<i data-lucide="'+it.icon+'" class="w-4 h-4 flex-shrink-0"></i><span class="truncate">'+it.label+'</span></button>';
  }).join('');
  renderIcons();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.toggle('hidden');
}

function setNav(id){
  activeNav=id;
  listPage=1;
  if(window.innerWidth<1024){
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }
  document.querySelectorAll('.nav-btn').forEach(function(b){
    const active=b.dataset.nav===id;
    b.classList.toggle('bg-blue-50',active);
    b.classList.toggle('text-blue-700',active);
    b.classList.toggle('text-slate-600',!active);
  });
  if(id==='beranda') renderBeranda();
  else if(id==='verifikasi') renderVerifikasi();
  else if(id==='pantauan') renderPantauan();
  else if(id==='master-event') renderMasterEvent();
  else if(id==='master-akses') renderMasterAkses();
  else if(id==='pengaturan') renderPengaturan();
  else if(id==='panduan') renderPanduan();
  else if(id==='ekspor') renderEkspor();
}

function startAutoRefresh(){

}

}

async function renderBeranda(){
  const main=document.getElementById('main-content');
  main.innerHTML='<div class="text-center py-10 text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Memuat...</div>'; renderIcons();
  await loadDashboard();
  const role=currentUser.role;
  const isSchool=role==='GURU'||role==='KS';
  let events=eventsData;
  if(role==='PANITIA') events=eventsData.filter(function(e){return e.id_event===currentUser.akses_event;});
  if(selectedEventId && !events.find(function(e){return e.id_event===selectedEventId;})) selectedEventId=null;

  if(!selectedEventId){
    let eventCards='';
    if(events.length===0){
      eventCards='<div class="bg-white rounded-2xl border">'+emptyState('calendar-x','Tidak ada event aktif','Belum ada event lomba yang dibuka untuk Anda saat ini.')+'</div>';
    } else {
      eventCards='<div class="grid md:grid-cols-2 gap-4">'+events.map(function(ev){
        return '<button onclick="selectEvent(\''+ev.id_event+'\')" class="text-left bg-white border rounded-2xl p-5 hover:shadow-lg hover:border-blue-400 transition group focus:ring-2 focus:ring-blue-500">'
          +'<div class="flex items-center justify-between mb-3">'
          +'<div class="w-11 h-11 rounded-xl flex items-center justify-center" style="'+chipStyle(ev.warna_aksen)+'"><i data-lucide="'+(ev.ikon_fallback||'award')+'" class="w-5 h-5"></i></div>'
          +'<span class="text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold">AKTIF</span></div>'
          +'<h3 class="font-bold group-hover:text-blue-600 transition">'+esc(ev.nama_event)+'</h3>'
          +'<p class="text-xs text-slate-400 mt-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Batas: '+esc(ev.batas_daftar||'-')+'</p></button>';
      }).join('')+'</div>';
    }
    const refreshBtn=(role==='PANITIA'||role==='ADMIN')?'<button onclick="manualRefresh()" class="p-2 rounded-lg bg-white border hover:bg-slate-50 text-slate-500" aria-label="Muat ulang"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>':'';

    +'<img src="'+esc(bg)+'" alt="Latar beranda" class="absolute inset-0 w-full h-full object-cover opacity-60" onerror="this.style.display=\'none\'">'
    +'<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>'

function renderPintasan(){
  const pintasans=[];
  for(let i=1;i<=3;i++){
    const label=settingsData['LABEL_'+i], link=settingsData['LINK_'+i], icon=settingsData['IKON_'+i]||'link';

    +'<div class="px-5 py-4 border-b flex items-center justify-between"><h3 class="font-semibold">Delegasi Peserta</h3><span class="text-xs text-slate-400">Total: '+rows.length+'</span></div>'
    +'<div class="overflow-x-auto"><table class="w-full text-sm">'
    +'<thead class="bg-slate-50 text-slate-500 text-xs uppercase"><tr><th class="px-4 py-3 text-left">Peserta</th><th class="px-4 py-3 text-left">Cabang</th><th class="px-4 py-3 text-left">Status</th><th class="px-4 py-3 text-right">Aksi</th></tr></thead>'

async function submitForm(){
  const cabang_id=document.getElementById('f-cabang').value;
  const cabang=getCabang(cabang_id);
  const link_syarat=document.getElementById('f-link').value.trim();
  if(cabang&&cabang.wajib_lampiran&&!link_syarat){ toast('Cabang ini wajib melampirkan berkas.','error'); return; }
  const payload={
    id_daftar:editingId||'NEW', id_event:selectedEventId, cabang_id:cabang_id,
    kategori_gender:document.getElementById('f-kategori').value,
    nama_peserta:document.getElementById('f-nama').value.trim(),
    jenis_kelamin:document.getElementById('f-jk').value,
    kelas:document.getElementById('f-kelas').value.trim(),
    tempat_lahir:document.getElementById('f-tempat').value.trim(),
    tanggal_lahir:document.getElementById('f-tanggal').value,
    nisn:document.getElementById('f-nisn').value.trim(), link_syarat:link_syarat
  };
  if(!payload.nama_peserta){ toast('Nama peserta wajib diisi.','error'); return; }
  const r=await talenta('submitDaftar',payload);
  if(r.status==='success'){ toast('Peserta berhasil disimpan.'); closeModal(); await loadDashboard(); renderEventDetail(); }
  else toast(r.message||'Gagal menyimpan.','error');
}

function hapusDaftar(id){
  confirmDialog('Peserta ini akan dihapus permanen.',async function(){
    const r=await talenta('hapusDaftar',{id_daftar:id});
    if(r.status==='success'){ toast('Peserta dihapus.'); await loadDashboard(); renderEventDetail(); }
    else toast(r.message||'Gagal menghapus.','error');
  },{title:'Hapus Peserta',confirmText:'Hapus',danger:true});
}

function lockEvent(){
  confirmDialog('Semua draft akan dikunci dan dikirim ke panitia untuk diverifikasi.',async function(){
    const r=await talenta('lockEvent',{id_event:selectedEventId});
    if(r.status==='success'){ toast(r.message||'Data terkunci.'); await loadDashboard(); renderEventDetail(); }
    else toast(r.message||'Tidak ada draft untuk dikunci.','error');
  },{title:'Kunci & Kirim',confirmText:'Kunci Sekarang',danger:false});
}

============================================================ */
function unduhBukti(id){
  const row=dashboardData.find(function(d){return d.id_daftar===id;});
  if(!row){ toast('Data tidak ditemukan.','error'); return; }
  const cabang=getCabang(row.cabang_id);
  const event=[].concat(eventsData,allEventsData).find(function(e){return e.id_event===row.id_event;});

    +'<option value="REVISI" '+(verifFilter.status==='REVISI'?'selected':'')+'>Perlu Revisi</option>'

function applyVerifFilter(rows){
  return rows.filter(function(r){
    if(verifFilter.status&&r.status_daftar!==verifFilter.status) return false;
    if(verifFilter.sekolah&&r.asal_sekolah!==verifFilter.sekolah) return false;
    if(verifFilter.cabang&&r.cabang_id!==verifFilter.cabang) return false;
    return true;
  });
}

function renderVerifikasiRows(){
  const rows=window.__verifFullRows||[];
  const filtered=applyVerifFilter(rows);
  const pg=paginate(filtered);
  const tbody=document.getElementById('verif-rows');
  const pagEl=document.getElementById('verif-pagination');
  if(!tbody) return;

  const trs=pg.data.map(function(r){
    const checkbox=r.status_daftar==='PENDING'
      ?'<input type="checkbox" data-verif="'+r.id_daftar+'" onchange="toggleVerifSelect(\''+r.id_daftar+'\',this.checked)" class="w-4 h-4" aria-label="Pilih peserta">'
      :'<span class="text-slate-300">—</span>';
    const berkas=r.link_syarat?'<a href="'+esc(r.link_syarat)+'" target="_blank" class="text-xs text-blue-600 flex items-center gap-1 mt-1"><i data-lucide="paperclip" class="w-3 h-3"></i>Lihat Berkas</a>':'';
    let aksi='';
    if(r.status_daftar==='PENDING'){
      aksi='<button onclick="verif(\''+r.id_daftar+'\',\'DISETUJUI\')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">Setujui</button>'
        +'<button onclick="openVerif(\''+r.id_daftar+'\')" class="px-3 py-1.5 rounded-lg bg-red-100 text-red-600 text-xs font-semibold hover:bg-red-200">Revisi</button>';
    } else if(r.status_daftar==='DISETUJUI'){
      aksi='<button onclick="openJuara(\''+r.id_daftar+'\')" class="px-3 py-1.5 rounded-lg bg-indigo-100 text-indigo-600 text-xs font-semibold hover:bg-indigo-200"><i data-lucide="trophy" class="w-3 h-3 inline"></i> Juara</button>';
    } else {
      aksi='<span class="text-xs text-slate-300">-</span>';
    }
    let extra='';
    if(r.status_juara) extra+='<p class="text-xs text-emerald-600 mt-1 font-semibold">Juara: '+esc(r.status_juara)+'</p>';
    if(r.catatan_panitia) extra+='<p class="text-xs text-slate-400 mt-1">'+esc(r.catatan_panitia)+'</p>';
    return '<tr class="border-t hover:bg-slate-50">'
      +'<td class="px-3 py-3 text-center">'+checkbox+'</td>'
      +'<td class="px-4 py-3"><p class="font-semibold">'+esc(r.nama_peserta)+'</p><p class="text-xs text-slate-400">'+esc(r.asal_sekolah)+' • NISN '+esc(r.nisn||'-')+'</p>'+berkas+'</td>'
      +'<td class="px-4 py-3">'+esc(getCabangName(r.cabang_id))+'<p class="text-xs text-slate-400">'+esc(r.kategori_gender||'-')+'</p></td>'
      +'<td class="px-4 py-3">'+statusBadge(r.status_daftar)+extra+'</td>'
      +'<td class="px-4 py-3 text-right whitespace-nowrap">'+aksi+'</td></tr>';
  }).join('');

  const emptyRow='<tr><td colspan="5">'+emptyState('inbox','Tidak ada data','Tidak ada data yang sesuai dengan filter saat ini.')+'</td></tr>';
  tbody.innerHTML=trs||emptyRow;
  if(pagEl) pagEl.innerHTML=paginationControls(pg.totalPages,'gotoVerifPage');
  renderIcons();
}

function toggleVerifSelect(id,checked){ if(checked)selectedVerif.add(id); else selectedVerif.delete(id); updateBulkButton(); }
function toggleAllVerif(checked){
  const rows=applyVerifFilter(window.__verifFullRows||[]);
  const pg=paginate(rows);
  pg.data.filter(function(r){return r.status_daftar==='PENDING';}).forEach(function(r){
    if(checked)selectedVerif.add(r.id_daftar); else selectedVerif.delete(r.id_daftar);
  });
  document.querySelectorAll('[data-verif]').forEach(function(chk){ chk.checked=checked; });
  updateBulkButton();
}
function updateBulkButton(){
  const btn=document.getElementById('btn-bulk'); const count=document.getElementById('bulk-count');
  if(btn&&count){ count.textContent=selectedVerif.size; btn.disabled=selectedVerif.size===0; }
}

function bulkVerif(status){
  if(selectedVerif.size===0) return;
  confirmDialog('Setujui '+selectedVerif.size+' peserta terpilih?',async function(){
    const r=await talenta('verifikasiMassal',{id_daftar_list:Array.from(selectedVerif),status_baru:status});
    if(r.status==='success'){ toast(r.message||'Berhasil diperbarui.'); selectedVerif.clear(); await loadDashboard(); renderVerifikasi(); }
    else toast(r.message||'Gagal memperbarui.','error');
  },{title:'Verifikasi Massal',confirmText:'Setujui Semua',danger:false});
}

async function verif(id,status,catatan){
  const r=await talenta('verifikasiData',{id_daftar:id,status_baru:status,catatan:catatan||''});
  if(r.status==='success'){ toast(r.message||'Status diperbarui.'); await loadDashboard(); renderVerifikasi(); }
  else toast(r.message||'Gagal memperbarui.','error');
}

function cellStatus(cell){
  if(!cell.length) return '<span class="inline-block w-3 h-3 rounded-full bg-slate-200"></span>';
  const st=cell.map(function(c){return c.status_daftar;});
  if(st.indexOf('DISETUJUI')>-1) return '<span class="inline-block w-3 h-3 rounded-full bg-emerald-500" title="'+cell.length+' disetujui"></span><span class="ml-1 text-emerald-600 font-semibold">'+cell.length+'</span>';
  if(st.indexOf('PENDING')>-1) return '<span class="inline-block w-3 h-3 rounded-full bg-amber-500" title="antrean"></span><span class="ml-1">'+cell.length+'</span>';
  if(st.indexOf('REVISI')>-1) return '<span class="inline-block w-3 h-3 rounded-full bg-red-500"></span>';
  return '<span class="inline-block w-3 h-3 rounded-full bg-slate-400"></span>';
}

function openAksesForm(email){

    const sel=a&&a.akses_event===e.id_event?'selected':'';
    return '<option value="'+e.id_event+'" '+sel+'>'+esc(e.nama_event)+'</option>';

    +'<div><label for="ak-email" class="block text-sm font-medium mb-1">Email Login *</label><input id="ak-email" value="'+esc(a?a.email:'')+'" '+(email?'disabled':'')+' placeholder="panitia@..." class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100"></div>'
    +'<div><label for="ak-nama" class="block text-sm font-medium mb-1">Nama Lengkap *</label><input id="ak-nama" value="'+esc(a?a.nama_panitia:'')+'" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"></div>'
    +'<div class="grid grid-cols-2 gap-3">'
    +'<div><label for="ak-role" class="block text-sm font-medium mb-1">Role *</label><select id="ak-role" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"><option '+((a&&a.role==='ADMIN')?'selected':'')+'>ADMIN</option><option '+((!a||a.role==='PANITIA')?'selected':'')+'>PANITIA</option></select></div>'
    +'<div><label for="ak-event" class="block text-sm font-medium mb-1">Akses Event</label><select id="ak-event" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"><option value="">Semua Event (Admin)</option>'+eventOpts+'</select></div></div>'
    +'<div><label for="ak-pin" class="block text-sm font-medium mb-1">'+(email?'PIN Baru (kosongkan jika tidak diubah)':'PIN *')+'</label><input id="ak-pin" type="password" placeholder="••••••" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"></div>'
    +'<div><label for="ak-valid" class="block text-sm font-medium mb-1">Berlaku Sampai (opsional)</label><input id="ak-valid" type="date" value="'+(a?a.valid_until:'')+'" class="w-full px-3 py-2.5 rounded-lg border outline-none focus:ring-2 focus:ring-blue-500"></div></div>'
    +'<div class="px-6 py-4 border-t flex gap-3">'
    +'<button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border font-semibold text-slate-600">Batal</button>'
    +'<button onclick="submitAksesForm('+(email?'\''+esc(email)+'\'':'null')+')" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700">Simpan Akun</button></div></div>';
  document.body.appendChild(modal); renderIcons();

async function submitAksesForm(email){
  const pin=document.getElementById('ak-pin').value;
  const payload={
    email:document.getElementById('ak-email').value.trim(),
    nama_panitia:document.getElementById('ak-nama').value.trim(),
    role:document.getElementById('ak-role').value,
    akses_event:document.getElementById('ak-event').value||null,
    pin:pin||undefined, is_active:true,
    valid_until:document.getElementById('ak-valid').value||null
  };
  if(!payload.email||!payload.nama_panitia){ toast('Email dan Nama wajib diisi.','error'); return; }
  if(!email&&!pin){ toast('PIN wajib diisi untuk akun baru.','error'); return; }
  const r=await talenta('savePanitia',payload);
  if(r.status==='success'){ toast(r.message||'Akun disimpan.'); closeModal(); await loadAksesList(); renderMasterAkses(); }
  else toast(r.message||'Gagal menyimpan.','error');
}

async function toggleAkses(email,activeBaru){
  const a=aksesListData.find(function(x){return x.email===email;});
  if(!a) return;
  const payload={email:email,nama_panitia:a.nama_panitia,role:a.role,akses_event:a.akses_event,is_active:activeBaru,valid_until:a.valid_until};
  const r=await talenta('savePanitia',payload);
  if(r.status==='success'){ toast(activeBaru?'Akun diaktifkan.':'Akun dinonaktifkan.'); await loadAksesList(); renderMasterAkses(); }
  else toast(r.message||'Gagal mengubah status.','error');
}

function deleteAkses(email){
  confirmDialog('Akun ini akan dihapus dan tidak bisa login lagi.',async function(){
    const r=await talenta('deletePanitia',{email:email});
    if(r.status==='success'){ toast('Akun dihapus.'); await loadAksesList(); renderMasterAkses(); }
    else toast(r.message||'Gagal menghapus.','error');
  },{title:'Hapus Akun',confirmText:'Hapus',danger:true});
}

/* ============================================================
   EKSPOR CSV
============================================================ */
async function renderEkspor(){
  const main=document.getElementById('main-content');
  await loadDashboard();
  let rows=dashboardData;
  if(currentUser.role==='PANITIA') rows=rows.filter(function(d){return d.id_event===currentUser.akses_event;});
  window.__exportRows=rows;
  let content='';
  if(rows.length===0){
    content='<div class="bg-white rounded-2xl border">'+emptyState('download','Tidak ada data','Belum ada data untuk diekspor pada event ini.')+'</div>';
  } else {
    content='<button onclick="downloadCSV()" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-semibold flex items-center gap-2 hover:bg-emerald-700"><i data-lucide="download" class="w-4 h-4"></i>Unduh File CSV</button>';
  }
  main.innerHTML='<h2 class="text-lg font-bold mb-1">Ekspor Data CSV</h2>'
    +'<p class="text-sm text-slate-500 mb-5">Jumlah baris: <b>'+rows.length+'</b></p>'+content;
  renderIcons();
}

function downloadCSV(){
  const rows=window.__exportRows||[];
  if(!rows.length){ toast('Tidak ada data untuk diekspor.','error'); return; }
  const header=['ID','Waktu','Event','Sekolah','Guru','Cabang','Kategori','Nama','JK','Kelas','Tempat Lahir','Tgl Lahir','NISN','Status','Catatan','Juara','Link Sertifikat'];
  const lines=[header.join(';')];
  rows.forEach(function(r){
    const vals=[r.id_daftar,r.created_at,r.id_event,r.asal_sekolah,r.guru_pendamping_nama,getCabangName(r.cabang_id),r.kategori_gender||'',r.nama_peserta,r.jenis_kelamin||'',r.kelas||'',r.tempat_lahir||'',r.tanggal_lahir||'',r.nisn||'',r.status_daftar,r.catatan_panitia||'',r.status_juara||'',r.link_sertifikat||''];
    lines.push(vals.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(';'));
  });
  const blob=new Blob(["\uFEFF"+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='portal-talenta-data.csv';
  a.click();
}
